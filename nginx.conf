gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript image/svg+xml;

# South Africa: Romanian when it's the browser's first language, English otherwise.
map $http_accept_language $sa_lang {
    default en;
    "~*^ro"  ro;
}

server {
    listen $PORT;
    server_name cinqueterre.travels.vhtm.eu;
    root /usr/share/nginx/html/cinque-terre;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

server {
    listen $PORT;
    server_name algarve.travels.vhtm.eu;
    root /usr/share/nginx/html/algarve;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

server {
    listen $PORT;
    server_name sa.travels.vhtm.eu;
    root /usr/share/nginx/html/south-africa;
    absolute_redirect off;

    location = / {
        add_header Cache-Control "no-cache";
        add_header Vary "Accept-Language";
        try_files /index.$sa_lang.html =404;
    }

    location ~ ^/(src/|build\.mjs|index\.) {
        return 404;
    }

    location ~ ^/(images|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}

# Default — catch-all for travels.vhtm.eu and unknown subdomains
server {
    listen $PORT default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        return 302 https://cinqueterre.travels.vhtm.eu/;
    }

    location / {
        return 404;
    }
}
