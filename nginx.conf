server {
    listen $PORT;
    server_name cinqueterre.travels.vhtm.eu;
    root /usr/share/nginx/html/cinque-terre;
    index index.html;

    # Short aliases for design variants
    rewrite ^/lemon$   /v4-lemon-grove.html last;
    rewrite ^/minimal$ /v3-mediterranean-minimal.html last;
    rewrite ^/dark$    /v5-dark-cinematic.html last;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# Default — catch-all for travels.vhtm.eu and unknown subdomains
server {
    listen $PORT default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        return 302 https://cinqueterre.travels.vhtm.eu/;
    }

    location / {
        return 404;
    }
}
